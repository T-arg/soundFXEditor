<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATMlib Sound Effects Editor</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="shortcut icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css?family=Cookie&display=swap" rel="stylesheet" />
<style>:root{--bg:#fefefd;--panel:#f5f5f3;--ink:#333;--muted:#6b5f5e;--accent:#4a3b3a;--warn:#c0392b;--yellow:#f4d35e;--line:#ddd}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 "Segoe UI",Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 14px;background:#fefefd;border-bottom:3px solid #4a3b3a;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.site-logo{display:flex;align-items:center;flex-shrink:0}.site-logo img{height:44px;width:auto;display:block}
header h1{font-size:16px;margin:0;color:#4a3b3a;letter-spacing:.04em}
.bmc-slot{margin-left:auto;display:flex;align-items:center}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px}
button,select,input[type=number],input[type=text]{background:#4a3b3a;color:#fefefd;border:1px solid #4a3b3a;padding:3px 8px;border-radius:3px;font:inherit}
button:hover{background:#2e2424;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.active{background:#2e2424;box-shadow:inset 0 0 0 1px #fefefd}
button.ghost{background:#fff;color:#4a3b3a}button.ghost:hover{background:#eee}
button.play{background:#f4d35e;color:#2e2424;border-color:#4a3b3a;font-weight:600;min-width:70px}
button.play.on{background:#c0392b;color:#fff}
button.sm{padding:1px 6px;font-size:12px}
input[type=number],input[type=text],select.light{background:#fff;color:#333}
input[type=number]{width:62px}
input[type=range]{accent-color:#4a3b3a;width:90px}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;height:calc(100vh - 62px);min-height:0}
.panel{padding:10px;overflow:auto;background:var(--panel);border-right:1px solid var(--line);min-height:0}
.panel.right{border-right:0;border-left:1px solid var(--line);background:#f7f6f4}
.panel.main{background:var(--bg);display:flex;flex-direction:column;padding:0;overflow:hidden}
.panel h2{font-size:12px;margin:12px 0 6px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.panel h2:first-child{margin-top:0}
.tabs{display:flex;gap:2px;margin:-10px -10px 10px;border-bottom:2px solid #4a3b3a;background:#ebe8e4;position:sticky;top:-10px;z-index:3}
.tabs button{flex:1;border-radius:0;background:transparent;color:#4a3b3a;border:0;padding:6px 4px}
.tabs button.active{background:#4a3b3a;color:#fefefd;box-shadow:none}
.row{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}
.row label{min-width:78px;color:var(--muted)}
.hint{color:var(--muted);font-size:12px}
.item{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:#fff;margin:3px 0;cursor:grab}
.item:hover{border-color:#4a3b3a}.item.sel{border-color:#4a3b3a;box-shadow:inset 3px 0 0 #f4d35e}
.item .chip{width:10px;height:22px;border-radius:2px;flex-shrink:0}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{color:var(--muted);font-size:11px}
.item canvas{display:block;flex-shrink:0}
.cat{font-size:11px;color:var(--muted);margin:8px 0 2px;text-transform:uppercase;letter-spacing:.05em}
.desc{font-size:11px;color:var(--muted);margin:0 0 4px 2px}
.arr{border-bottom:2px solid #4a3b3a;background:#faf9f7;flex:0 0 auto;max-height:46%;display:flex;flex-direction:column;min-height:150px}
.bar{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);background:#f1efeb;flex-wrap:wrap}
.bar b{color:var(--accent)}
.arr-scroll{overflow:auto;flex:1;position:relative}
.arr-inner{position:relative;min-width:100%}
.ruler{height:20px;position:relative;border-bottom:1px solid var(--line);margin-left:92px;background:#f1efeb}
.ruler span{position:absolute;top:2px;font-size:10px;color:var(--muted);border-left:1px solid #bbb;padding-left:2px;height:16px}
.lane{display:flex;height:50px;border-bottom:1px solid var(--line)}
.lane .lab{width:92px;flex-shrink:0;position:sticky;left:0;z-index:4;background:#ebe8e4;border-right:1px solid #bbb;padding:3px 6px;font-size:11px;line-height:1.25;display:flex;flex-direction:column;justify-content:center}
.lane .lab b{color:var(--accent)}
.lane .lab .mute{font-size:10px;padding:0 4px;margin-top:2px;width:max-content}
.lane .track{position:relative;flex:1}
.lane.drop .track{background:#fff6d6}
.blk{position:absolute;top:4px;height:42px;border-radius:4px;color:#fff;font-size:11px;padding:2px 5px;overflow:hidden;white-space:nowrap;cursor:grab;border:2px solid transparent;user-select:none}
.blk.sel{border-color:#f4d35e;box-shadow:0 0 0 2px #4a3b3a}
.blk small{display:block;opacity:.8;font-size:10px}
.blk canvas{position:absolute;left:0;right:0;bottom:0;opacity:.55;pointer-events:none}
.pad{position:absolute;top:4px;bottom:4px;background:repeating-linear-gradient(45deg,#e9e5df,#e9e5df 4px,#f3f0ec 4px,#f3f0ec 8px);border:1px dashed #b9b1a8;border-radius:4px;pointer-events:none}
.ins{position:absolute;top:2px;bottom:2px;width:3px;background:#c0392b;z-index:5;pointer-events:none}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:#c0392b;z-index:6;pointer-events:none;display:none}
.bargrid{position:absolute;top:20px;bottom:0;border-left:1px dotted #d6d0c8;pointer-events:none}
.ped{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.ped-scroll{flex:1;overflow:auto;position:relative;background:#fff}
.roll{display:flex;width:max-content}
.roll canvas.keys{position:sticky;left:0;z-index:2}
.empty{padding:30px;text-align:center;color:var(--muted)}
.empty div{border:1px dashed #4a3b3a;border-radius:8px;padding:26px;background:#fff;display:inline-block;max-width:520px}
.kv{width:100%;border-collapse:collapse}.kv td{padding:1px 3px;font-size:12px}
.msg{padding:6px 8px;border-radius:4px;margin:4px 0;font-size:12px}
.msg.err{background:#fbe3df;border:1px solid #c0392b;color:#7b1f14}
.msg.warn{background:#fff3d1;border:1px solid #c9a227;color:#6b5400}
.msg.ok{background:#e3f1e3;border:1px solid #3d6b3d;color:#244224}
textarea.code{width:100%;height:300px;font:11px/1.35 ui-monospace,monospace;border:1px solid #4a3b3a;padding:6px;background:#fff;color:#333;resize:vertical}
.bmc-btn{min-width:200px;color:#fefefd!important;background:#5d4c4b!important;height:48px;border-radius:12px;font-size:24px;font-weight:normal;border:none;padding:0 20px;line-height:24px;text-decoration:none!important;display:inline-flex!important;align-items:center;font-family:"Cookie",cursive!important}
.bmc-btn-text{margin-left:8px;white-space:nowrap;line-height:1}
kbd{font:11px ui-monospace,monospace;border:1px solid #4a3b3a;border-bottom-width:2px;border-radius:3px;padding:0 4px;background:#fff}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#4a3b3a;color:#fff;padding:8px 16px;border-radius:6px;z-index:99;display:none;max-width:80vw}
a.manual{color:#4a3b3a;text-decoration:none;border:1px solid #4a3b3a;border-radius:3px;padding:3px 8px;background:#f4d35e;font-weight:600}
a.manual:hover{background:#e8c443}
.modal{position:fixed;inset:0;background:rgba(40,30,30,.55);z-index:50;display:flex;align-items:center;justify-content:center}
.dlg{background:#fefefd;border:3px solid #4a3b3a;border-radius:8px;padding:18px;width:min(520px,92vw);max-height:80vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.layout.fx{grid-template-columns:280px minmax(0,1fr) 320px}
.panel.centre{background:var(--bg);padding:0;display:flex;flex-direction:column;overflow:auto}
.cbody{padding:12px 16px 40px;max-width:900px;width:100%}
.cbody h2{font-size:12px;margin:18px 0 8px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.vizbox{border:1px solid #4a3b3a;border-radius:6px;background:#fff;overflow:hidden}
.vizbox canvas{display:block}
.vizinfo{padding:4px 10px;font-size:12px;color:var(--muted);background:#f1efeb;border-top:1px solid #ddd}
.ctl{display:grid;grid-template-columns:230px minmax(0,1fr) 64px;gap:10px;align-items:center;margin:7px 0}
.ctl.notes{grid-template-columns:70px minmax(0,1fr) 54px 36px minmax(0,1fr) 40px 30px}
.ctl label{color:var(--muted)}
.ctl input[type=range]{width:100%;height:22px}
.ctl .val{font:12px ui-monospace,monospace;color:var(--accent);text-align:right}
pre.cmds{background:#fff;border:1px solid #4a3b3a;border-radius:4px;padding:10px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;margin:6px 0}
@media(max-width:1000px){.ctl{grid-template-columns:130px minmax(0,1fr) 54px}}

.chpick{display:inline-flex;gap:4px}.chb{border:2px solid var(--c);background:#fff;color:var(--c);font-weight:700;border-radius:4px;padding:3px 9px;cursor:pointer}.chb.on{background:var(--c);color:#fff}.chb:disabled{opacity:.28;cursor:not-allowed}
</style></head><body>

    len: o.len || 64, color: o.color || pickColor(song), inst: o.inst || null,
    notes: o.notes ? clone(o.notes) : [], hits: o.hits ? clone(o.hits) : [], fx: o.fx ? clone(o.fx) : []

/* keep a tone pattern monophonic and inside its length */
function normalizeTone(P) {
  const out = [];
  P.notes.sort((a, b) => a.t - b.t || b.l - a.l);
  for (const n of P.notes) {
    n.t = Math.max(0, Math.round(n.t)); n.l = Math.max(1, Math.round(n.l)); n.n = clamp(Math.round(n.n), NOTE_MIN, NOTE_MAX);
    if (n.t >= P.len) continue;
    if (n.t + n.l > P.len) n.l = P.len - n.t;
    const prev = out[out.length - 1];
    if (prev && prev.t === n.t) { out[out.length - 1] = n; continue; }
    if (prev && prev.t + prev.l > n.t) prev.l = n.t - prev.t;
    out.push(n);
  }
  P.notes = out;
}
/* write a note and make room for it (the new note wins) */
function putNote(P, t, n, l) {
  l = Math.max(1, Math.min(l, P.len - t));
  P.notes = P.notes.filter(x => !(x.t >= t && x.t < t + l));
  P.notes.forEach(x => { if (x.t < t && x.t + x.l > t) x.l = t - x.t; });
  const note = { t: t, n: n, l: l };
  P.notes.push(note); P.notes.sort((a, b) => a.t - b.t);
  return note;
}

  const h = { t: t, d: d }; if (v !== undefined) h.v = v;
  P.hits.push(h); P.hits.sort((a, b) => a.t - b.t);

/* instrument -> list of fx events at tick 0 */
function instEvents(I) {
  const ev = [{ k: 'vol', a: [I.vol | 0] }];
  const s = I.slide || { k: 'none' };
  if (s.k === 'vol') ev.push({ k: 'slvol', a: [s.s] });
  else if (s.k === 'volAdv') ev.push({ k: 'slvola', a: [s.s, s.t | 0] });
  else if (s.k === 'frq') ev.push({ k: 'slfrq', a: [s.s] });
  else if (s.k === 'frqAdv') ev.push({ k: 'slfrqa', a: [s.s, s.t | 0] });
  else ev.push({ k: 'slvoloff', a: [] });
  const g = I.gate || { k: 'none' };
  if (g.k === 'arp') { const c = chordById(g.chord) || CHORDS[1]; ev.push({ k: 'arp', a: [g.a !== undefined ? g.a : c.a, arpY(g.ticks || 1, g.retrig !== false, c.two)] }); }
  else if (g.k === 'cut') ev.push({ k: 'cut', a: [g.n | 0] });
  else ev.push({ k: 'arpoff', a: [] });
  const m = I.mod || { k: 'none' };
  if (m.k === 'vib') ev.push({ k: 'vib', a: [m.d | 0, m.r | 0] });
  else if (m.k === 'trem') ev.push({ k: 'trem', a: [m.d | 0, m.r | 0] });
  else ev.push({ k: 'viboff', a: [] });
  const l = I.glis || { k: 'none' };
  if (l.k === 'up') ev.push({ k: 'glis', a: [(Math.max(2, l.t | 0) - 1) & 127] });
  else if (l.k === 'down') ev.push({ k: 'glis', a: [0x80 | ((Math.max(2, l.t | 0) - 1) & 127)] });
  else ev.push({ k: 'glisoff', a: [] });
  return ev;
}

  if (noise) { const tot = seq.reduce((a, s) => a + s.l, 0); seq = [{ n: -1, l: tot }]; }
  let total = seq.reduce((a, s) => a + s.l, 0);
  if (g.tail > 0) { if (noise) seq[0].l += g.tail; else seq.push({ n: 0, l: g.tail }); total += g.tail; }
  const ev = {};   /* tick -> [cmd] */
  const add = (t, c) => { (ev[t] = ev[t] || []).push(c); };
  const C = (k, a) => A.mkCmd(k, a, null);
  const vol = clamp(g.vol | 0, 0, 63);
  add(0, C('vol', [vol]));
  /* slot: pitch slide first, then fade */
  const fade = g.fade | 0;
  const fadeCmd = () => {
    if (fade === 0) return null;
    const mag = Math.abs(fade), up = fade < 0;
    const e = Math.max(1, g.fadeEvery | 0);
    if (e > 1) return C('slvola', [up ? mag : -mag, e - 1]);
    return C('slvol', [up ? mag : -mag]);
  };
  if (!noise && g.pslide) {
    add(0, C('slfrq', [clamp(g.pslide | 0, -127, 127)]));
    const sw = clamp(g.pslideT | 0, 1, total);
    if (sw < total) {
      const f = fadeCmd();
      add(sw, f || C('slfrqoff', []));
    }
  } else { const f = fadeCmd(); if (f) add(0, f); }
  /* a rising volume must be stopped before it passes 63 */
  if (fade < 0 && !(!noise && g.pslide)) {
    const step = Math.abs(fade) / Math.max(1, g.fadeEvery | 0);
    const tStop = Math.ceil((63 - vol) / step);
    if (tStop < total) add(Math.max(1, tStop - 1), C('slvoloff', []));
  }
  if (!noise && g.tex === 'arp') { const c = A.chordById(g.chord) || A.CHORDS[0]; add(0, C('arp', [c.a, A.arpY(g.arpT | 0 || 1, true, c.two)])); }
  else if (!noise && g.tex === 'cut') add(0, C('cut', [0x20 + clamp(g.cutN | 0, 0, 31)]));
  if (g.wobble === 'vib' && !noise) add(0, C('vib', [clamp(g.wd | 0, 0, 255), clamp(g.wr | 0, 0, 31)]));
  else if (g.wobble === 'trem') add(0, C('trem', [clamp(g.wd | 0, 0, 255), clamp(g.wr | 0, 0, 31)]));
  if (!noise && g.glis) { const per = g.glis < 0 ? Math.max(1, -g.glis) : Math.max(2, g.glis); add(0, C('glis', [((per - 1) & 127) | (g.glis < 0 ? 0x80 : 0)])); }   /* an upward GLIS(0) does nothing in the playroutine, so the shortest upward step is 2 ticks */
  if (noise && g.rumble) { add(0, C('nse', [g.rumble & 255])); if (total >= 2) add(total - 1, C('nseoff', [])); }
  if (!noise && g.tra) add(0, C('settra', [clamp(g.tra | 0, -63, 63)]));
  let t = 0;
  seq.forEach(s => {
    if (s.tra) add(t, C('addtra', [clamp(s.tra, -63, 63)]));
    if (s.n > 0) add(t, { b: [s.n], t: A.noteMacro(s.n) });
    else if (s.n === 0) add(t, { b: [0], t: '0x00', cm: 'rest' });
    t += s.l;
  });
  /* emit with delays between event ticks */
  const ticks = Object.keys(ev).map(Number).sort((a, b) => a - b);
  const cmds = []; let cur = 0;
  ticks.forEach(tk => {
    if (tk > cur) { A.delayCmds(tk - cur).forEach(d => cmds.push(d)); cur = tk; }
    /* order inside one tick: state commands first, then the note */
    const list = ev[tk]; const st = list.filter(c => c.b[0] >= 0x40), nt = list.filter(c => c.b[0] < 0x40);
    st.concat(nt).forEach(c => cmds.push(c));
  });
  if (total > cur) A.delayCmds(total - cur).forEach(d => cmds.push(d));
  const bytes = []; cmds.forEach(c => c.b.forEach(x => bytes.push(x))); bytes.push(0x9F);
  return { cmds: cmds, bytes: Uint8Array.from(bytes), size: bytes.length, ticks: total, ch: g.ch, warnings: warn, g: g };
}

function upd(e) { updInfo(e); schedule(e); saveLocal(); const li = $('#left'); }
function updInfo(e) {

function advPanel(body, e) {

function drawViz() {
  const cv = $('#viz'); if (!cv) return; const e = curE();
  const V = UI.viz && e && UI.viz.id === e.id ? UI.viz : null;
  const W = cv.parentElement.clientWidth || 600, H = 170; cv.width = W; cv.height = H; cv.style.width = W + 'px';
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#eee'; for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(0, i * H / 4 + .5); g.lineTo(W, i * H / 4 + .5); g.stroke(); }
  if (!V) { g.fillStyle = '#999'; g.font = '13px sans-serif'; g.fillText('Press Play to see the sound', 14, 24); return; }
  const d = V.data, n = Math.max(1, V.r.ticks), bw = (W - 20) / Math.max(n, 8), x0 = 10;
  let mx = 0.05; d.forEach(p => { mx = Math.max(mx, p.a); });
  d.slice(0, n).forEach((p, i) => { const hh = (p.a / mx) * (H - 36); g.fillStyle = F.CHCOL[V.r.ch]; g.fillRect(x0 + i * bw + 1, H - 16 - hh, Math.max(1, bw - 2), hh); });
  if (V.r.ch !== 3) {
    g.strokeStyle = '#333'; g.lineWidth = 2; g.beginPath(); let first = true;
    d.slice(0, n).forEach((p, i) => { if (p.a < mx * 0.04 || p.f < 40) { first = true; return; } const y = H - 16 - (Math.log(Math.min(p.f, 5000) / 40) / Math.log(5000 / 40)) * (H - 36); const x = x0 + i * bw + bw / 2; if (first) { g.moveTo(x, y); first = false; } else g.lineTo(x, y); });
    g.stroke(); g.lineWidth = 1;
  }
  g.fillStyle = '#6b5f5e'; g.font = '11px sans-serif'; const stepT = n > 60 ? 16 : n > 24 ? 8 : 4;
  for (let i = 0; i <= n; i += stepT) { g.fillText(i + '', x0 + i * bw, H - 3); }
  g.fillText('ticks', W - 34, H - 3);
  g.fillStyle = F.CHCOL[V.r.ch]; g.fillRect(W - 150, 8, 10, 10); g.fillStyle = '#333'; g.fillText('volume', W - 135, 17);
  if (V.r.ch !== 3) { g.fillStyle = '#333'; g.fillRect(W - 80, 11, 14, 3); g.fillStyle = '#333'; g.fillText('pitch', W - 62, 17); }
}

document.addEventListener('keydown', ev => {
  const tg = ev.target; if (tg && /^(INPUT|SELECT|TEXTAREA)$/.test(tg.tagName) && tg.type !== 'range' && tg.type !== 'checkbox') return;
  const k = ev.key.toLowerCase(), mod = ev.ctrlKey || ev.metaKey;
  if (mod && k === 'z') { ev.preventDefault(); ev.shiftKey ? doRedo() : doUndo(); return; }
